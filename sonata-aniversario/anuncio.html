<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sonata Aniversário</title>
<style>
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 400 500; src: url("fonts/jakarta-500.ttf"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 600; src: url("fonts/jakarta-600.ttf"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 700; src: url("fonts/jakarta-700.ttf"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 800; src: url("fonts/jakarta-800.ttf"); }

  :root {
    --navy: #0f2147;
    --navy-soft: #4a5878;
    --teal: #13a8ac;
    --teal-dark: #0b8b8f;
    --teal-tint: #e3f5f5;
    --bg: #f7f8f8;
    --line: #e1e6ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #ddd; }
  body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--navy); font-feature-settings: "calt" 0; }

  .ad {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 72px 80px 80px;
    overflow: hidden;
    background:
      radial-gradient(900px 600px at 100% 0%, #e6f5f5 0%, transparent 60%),
      radial-gradient(700px 500px at 0% 100%, #eaf4f6 0%, transparent 60%),
      var(--bg);
    display: flex;
    flex-direction: column;
  }

  /* Cabeçalho */
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
  .logo b { font-weight: 500; font-size: 44px; letter-spacing: .28em; color: var(--navy); }
  .logo span { margin-top: 8px; font-size: 17px; letter-spacing: .14em; color: var(--navy-soft); }
  .loc {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px; border: 1.5px solid var(--line); border-radius: 999px;
    background: #fff; font-size: 19px; font-weight: 600; color: var(--navy);
  }
  .loc svg { width: 20px; height: 20px; color: var(--teal); }

  /* Headline */
  .tag {
    margin-top: 88px; align-self: flex-start;
    padding: 12px 24px; border-radius: 999px;
    background: var(--teal-tint); color: var(--teal-dark);
    font-size: 20px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  }
  h1 {
    margin-top: 28px;
    font-size: 80px; line-height: 1.06; font-weight: 800; letter-spacing: -.025em;
  }
  h1 em { font-style: normal; color: var(--teal); }

  /* Produto + preço */
  .offer {
    margin-top: 56px;
    display: grid; grid-template-columns: 420px 1fr; align-items: center; gap: 48px;
    margin-left: -20px;
  }
  .product {
    position: relative; height: 420px;
    display: grid; place-items: center;
  }
  .product::before {
    content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #eef6f7 60%, rgba(238,246,247,0) 72%);
  }
  .product i {
    position: relative; display: block;
    width: 460px; height: 405px;
    background: url("original.webp") no-repeat;
    background-size: 1122px auto;
    background-position: -105px -692px;         /* recorte do aparelho */
    mix-blend-mode: multiply;
    -webkit-mask-image: radial-gradient(ellipse 54% 52% at 55% 52%, #000 76%, transparent 100%);
            mask-image: radial-gradient(ellipse 54% 52% at 55% 52%, #000 76%, transparent 100%);
  }

  .price small { display: block; font-size: 24px; font-weight: 600; color: var(--navy-soft); }
  .price .value {
    display: flex; align-items: flex-start; gap: 10px; margin-top: 4px;
    color: var(--teal); font-weight: 800; letter-spacing: -.04em; line-height: 1;
  }
  .price .value sup { font-size: 40px; margin-top: 18px; letter-spacing: 0; }
  .price .value strong { font-size: 140px; }
  .price .inst {
    margin-top: 18px; font-size: 26px; color: var(--navy-soft);
  }
  .price .inst b { color: var(--navy); font-weight: 700; }

  /* Benefícios */
  .benefits {
    margin-top: auto;
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1.5px solid var(--line);
    padding-top: 40px;
  }
  .benefit { display: flex; align-items: center; gap: 16px; }
  .benefit + .benefit { padding-left: 28px; border-left: 1.5px solid var(--line); }
  .benefit .ic {
    flex: none; width: 60px; height: 60px; border-radius: 50%;
    display: grid; place-items: center; background: var(--teal-tint); color: var(--teal-dark);
  }
  .benefit .ic svg { width: 30px; height: 30px; }
  .benefit p { font-size: 23px; font-weight: 600; line-height: 1.2; }

  /* CTA */
  .cta {
    margin-top: 56px;
    display: flex; justify-content: center; align-items: center; gap: 14px;
    height: 104px; border-radius: 999px;
    background: var(--navy); color: #fff;
    font-size: 32px; font-weight: 700; letter-spacing: -.01em;
    box-shadow: 0 18px 40px -18px rgba(15,33,71,.55);
  }
  .cta svg { width: 28px; height: 28px; color: var(--teal); }
</style>
</head>
<body>
<div class="ad">
  <div class="top">
    <div class="logo"><b>SONATA</b><span>aparelhos auditivos</span></div>
    <div class="loc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      Porto Alegre e região
    </div>
  </div>

  <div class="tag">Promoção de Aniversário</div>
  <h1>Aparelho auditivo<br>com <em>60% de desconto</em></h1>

  <div class="offer">
    <div class="product"><i></i></div>
    <div class="price">
      <small>Por apenas</small>
      <div class="value"><sup>R$</sup><strong>1.990</strong></div>
      <p class="inst">ou <b>18x de R$ 110,50</b></p>
    </div>
  </div>

  <div class="benefits">
    <div class="benefit">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <p>Quase<br>invisível</p>
    </div>
    <div class="benefit">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10v4M7 7v10M11 4v16M15 8v8M19 10v4"/></svg></div>
      <p>Som<br>natural</p>
    </div>
    <div class="benefit">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2-5 3 10 3-8 2 3h6"/></svg></div>
      <p>Menos<br>ruído</p>
    </div>
  </div>

  <div class="cta">
    Agende sua avaliação
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
</div>
</body>
</html>
