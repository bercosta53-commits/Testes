<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion Showreel 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: 'Unbounded'; font-weight: 900; src: url(fonts/Unbounded-Black.ttf); }
  @font-face { font-family: 'Space Grotesk'; font-weight: 500; src: url(fonts/SpaceGrotesk-Medium.ttf); }
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(fonts/SpaceGrotesk-Bold.ttf); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(fonts/JetBrainsMono-Medium.ttf); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 800; src: url(fonts/JetBrainsMono-ExtraBold.ttf); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url(fonts/InstrumentSerif-Italic.ttf); }
  html, body { margin: 0; background: #000; height: 100%; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; }
  body.render canvas { max-width: none; max-height: none; }
  #play { position: fixed; inset: 0; background: transparent; border: 0; color: #f3efe6;
          font: 500 14px 'JetBrains Mono', monospace; letter-spacing: .2em; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="reel.js"></script>
</body>
</html>
