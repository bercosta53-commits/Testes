<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Movimento</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap"><style>
.mov { display:grid; gap: var(--espaco-5); padding: var(--espaco-5); }
.mov__linha { display:grid; grid-template-columns: 132px 1fr 220px; gap: var(--espaco-5); align-items:center; padding-bottom: var(--espaco-4); border-bottom: 1px solid var(--linha); }
.mov__curva { width:120px; height:120px; display:block; }
.mov__curva .eixo { stroke: var(--linha); fill: none; }
.mov__curva .traco { stroke: var(--uniao); stroke-width: 2.5; fill: none; }
.mov__pista { position:relative; height: 56px; background: var(--agua-suave); overflow:hidden; }
.mov__pista::before { content:""; position:absolute; left:0; right:0; top:50%; border-top:2px dashed var(--agua); opacity:.6; }
.mov__barco { position:absolute; top:50%; left:0; width:72px; height:14px; margin-top:-7px; border-radius: var(--raio-boia); background: var(--tinta); }
.mov__barco::after { content:""; position:absolute; right:6px; top:3px; width:16px; height:8px; border-radius: var(--raio-boia); background: var(--remo); }
.mov__barco--deslize { animation: mov-ida var(--tempo-remada) var(--curva-deslize) infinite; }
.mov__barco--puxada { animation: mov-ida var(--tempo-remada) var(--curva-puxada) infinite; }
.mov__barco--ataque { animation: mov-ida var(--tempo-remada) var(--curva-ataque) infinite; }
@keyframes mov-ida { 0% { transform: translateX(0); } 66% { transform: translateX(calc(100cqw - 72px)); } 100% { transform: translateX(calc(100cqw - 72px)); } }
.mov__pista { container-type: inline-size; }
.mov__texto { display:grid; gap: 4px; }
.mov__tempos { display:flex; align-items:end; gap: var(--espaco-5); }
.mov__tempo { display:grid; gap: var(--espaco-2); }
.mov__tempo i { display:block; height: 8px; border-radius: var(--raio-boia); background: var(--uniao); }
@media (prefers-reduced-motion: reduce) { .mov__barco { animation: none !important; } }
</style></head>
<body class="gnu">

<div class="mov">
  <div class="mov__linha"><svg class="mov__curva" viewBox="-5 -5 130 130" aria-hidden="true"><path class="eixo" d="M0 0V110H110"/><path class="traco" d="M0 110 C17.6 0.0 33.0 0.0 110 0"/></svg><div class="mov__pista"><span class="mov__barco mov__barco--deslize"></span></div>
    <div class="mov__texto"><p class="gnu-titulo-3">Deslize</p><p class="gnu-corpo-p gnu-suave">curva-deslize · entradas, hover. A curva padrão.</p></div></div>
  <div class="mov__linha"><svg class="mov__curva" viewBox="-5 -5 130 130" aria-hidden="true"><path class="eixo" d="M0 0V110H110"/><path class="traco" d="M0 110 C71.5 110.0 38.5 0.0 110 0"/></svg><div class="mov__pista"><span class="mov__barco mov__barco--puxada"></span></div>
    <div class="mov__texto"><p class="gnu-titulo-3">Puxada</p><p class="gnu-corpo-p gnu-suave">curva-puxada · de A para B: abas, carrossel, página.</p></div></div>
  <div class="mov__linha"><svg class="mov__curva" viewBox="-5 -5 130 130" aria-hidden="true"><path class="eixo" d="M0 0V110H110"/><path class="traco" d="M0 110 C55.0 110.0 82.5 110.0 110 0"/></svg><div class="mov__pista"><span class="mov__barco mov__barco--ataque"></span></div>
    <div class="mov__texto"><p class="gnu-titulo-3">Ataque</p><p class="gnu-corpo-p gnu-suave">curva-ataque · saídas, sem cerimônia.</p></div></div>
  <div class="mov__tempos" aria-label="Escala de tempo">
    <div class="mov__tempo"><i style="width: 12px"></i><span class="gnu-legenda gnu-num">tempo-1 · 120ms</span></div>
    <div class="mov__tempo"><i style="width: 24px"></i><span class="gnu-legenda gnu-num">tempo-2 · 240ms</span></div>
    <div class="mov__tempo"><i style="width: 42px"></i><span class="gnu-legenda gnu-num">tempo-3 · 420ms</span></div>
    <div class="mov__tempo"><i style="width: 72px"></i><span class="gnu-legenda gnu-num">tempo-4 · 720ms</span></div>
    <div class="mov__tempo"><i style="width: 180px"></i><span class="gnu-legenda gnu-num">tempo-remada · 1800ms (600 + 1200)</span></div>
  </div>
</div>
</body>
</html>
