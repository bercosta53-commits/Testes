<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>GNU Sistema Visual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300..700;1,300..700&amp;display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--fundo); color: var(--tinta); font-family: var(--font-raleway); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .marca { fill: var(--azul-marca); }
  .marinho { fill: var(--marinho); }
  .areia { fill: var(--fundo-areia); }
  .tint { fill: var(--ciano-claro); }
  .ciano { fill: var(--ciano); }
  .fio { fill: var(--fundo); }
  .r2 { rx: var(--raio-2); }
  .words { position: absolute; left: var(--espaco-6); bottom: var(--espaco-6); max-width: 440px; }
  .name { margin: 0; font-size: 64px; line-height: 0.95; font-weight: 300; letter-spacing: -0.01em; color: var(--tinta); }
  .name b { font-weight: 600; color: var(--azul); }
  .tag { margin: var(--espaco-4) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--tinta-suave); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      azul-marca 192×222 sangrando no topo (o azul exato do clube, a maior área) · marinho 224×216 sangrando à direita e embaixo · ciano-claro 112×48 (o tom da etiqueta Mais buscado) · fundo-areia 232×48 como respiro — cerca de 40% de 960×288; ciano só nos fios curtos
  arrangement uma lâmina alta de azul com um bloco marinho deslocado, em degrau, como as faixas de cabeçalho e de seção do site
  pattern     fios finos, de "campos só com fio inferior e sobretítulo com fio curto em ciano": três fios de 1px recortados no fundo atravessando os blocos e dois fios curtos de ciano
  scales      lados em múltiplos de espaco-2 (8) e espaco-6 (32); afastamentos espaco-4 (16) e espaco-7 (48); cantos raio-2 (6)
-->
<rect class="marca r2" x="48" y="-6" width="192" height="222"/>
<rect class="tint r2" x="256" y="0" width="112" height="48"/>
<rect class="marinho r2" x="256" y="72" width="224" height="222"/>
<rect class="areia r2" x="48" y="232" width="192" height="62"/>
<rect class="fio" x="48" y="120" width="432" height="1"/>
<rect class="fio" x="48" y="152" width="432" height="1"/>
<rect class="fio" x="48" y="184" width="432" height="1"/>
<rect class="ciano" x="80" y="56" width="24" height="2"/>
<rect class="ciano" x="288" y="232" width="24" height="2"/>
</svg>
</div>
<div class="words">
<h1 class="name">GNU Sistema <b>Visual</b></h1>
<p class="tag">A estrutura de hoje, com acabamento de clube de alto padrão.</p>
</div>
</div>
</body>
</html>
