<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Formulário</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300..700;1,300..700&amp;display=swap"></head>
<body class="gnu">

<div class="gnu-previa gnu-faixa-areia" style="justify-items: center">
  <div class="gnu-form-cartao" style="width: 100%; max-width: 440px">
    <p class="gnu-form-cartao__titulo">Faça parte do <b>Grêmio Náutico União</b></p>
    <form class="gnu-form" novalidate onsubmit="event.preventDefault()">
  <div class="gnu-campo"><label for="f-nome">Nome completo</label><input id="f-nome" autocomplete="name" placeholder="Ex.: Ana Souza"></div>
  <div class="gnu-campo"><label for="f-email">E-mail</label><input id="f-email" type="email" autocomplete="email" placeholder="ana@email.com"></div>
  <div class="gnu-campo"><label for="f-tel">Telefone</label><input id="f-tel" type="tel" autocomplete="tel" placeholder="(51) 90000-0000"></div>
  <div class="gnu-campo"><label for="f-motivo">Motivo do contato</label><select id="f-motivo"><option>Quero ser associado</option><option>Conhecer as sedes</option><option>Outro assunto</option></select></div>
  <div class="gnu-campo"><label for="f-plano">Planos</label><select id="f-plano"><option>Título Patrimonial</option><option>Contribuinte Efetivo</option><option>Ainda não sei</option></select></div>
  <label class="gnu-consentimento" for="f-ok"><input id="f-ok" type="checkbox"><span>Aceito a <a href="#">Política de Privacidade</a> e autorizo o contato do GNU.</span></label>
  <button class="gnu-btn gnu-btn--primario gnu-btn--bloco" type="submit">Quero ser associado</button>
</form>
  </div>
</div>
</body>
</html>
