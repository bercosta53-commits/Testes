<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Seja associado</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300..700;1,300..700&amp;display=swap"><style>
.h { display:grid; grid-template-columns: 1.05fr 1fr; min-height: 620px; background: var(--fundo-areia); }
.h__texto { display:grid; align-content:center; gap: var(--espaco-6); padding: var(--espaco-7) var(--espaco-7); }
.h__foto { position:relative; }
.h__foto img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.h .gnu-form-cartao { max-width: 520px; }
.h .gnu-form { grid-template-columns: 1fr 1fr; column-gap: var(--espaco-5); }
.h .gnu-form > :nth-child(1), .h .gnu-form > :nth-child(n+6) { grid-column: 1 / -1; }
</style></head>
<body class="gnu">

<section class="h">
  <div class="h__texto">
    <p class="gnu-sobretitulo">120 anos em movimento</p>
    <h1 class="gnu-display">Seja <b style="color: var(--azul)">associado</b></h1>
    <p class="gnu-lead gnu-suave">Para relaxar, conviver ou se exercitar: quatro sedes em Porto Alegre pensadas para você e sua família viverem bons momentos.</p>
    <div class="gnu-form-cartao">
      <p class="gnu-form-cartao__titulo">Faça parte do <b>Grêmio Náutico União</b></p>
      <form class="gnu-form" novalidate onsubmit="event.preventDefault()">
  <div class="gnu-campo"><label for="h-nome">Nome completo</label><input id="h-nome" autocomplete="name" placeholder="Ex.: Ana Souza"></div>
  <div class="gnu-campo"><label for="h-email">E-mail</label><input id="h-email" type="email" autocomplete="email" placeholder="ana@email.com"></div>
  <div class="gnu-campo"><label for="h-tel">Telefone</label><input id="h-tel" type="tel" autocomplete="tel" placeholder="(51) 90000-0000"></div>
  <div class="gnu-campo"><label for="h-motivo">Motivo do contato</label><select id="h-motivo"><option>Quero ser associado</option><option>Conhecer as sedes</option><option>Outro assunto</option></select></div>
  <div class="gnu-campo"><label for="h-plano">Planos</label><select id="h-plano"><option>Título Patrimonial</option><option>Contribuinte Efetivo</option><option>Ainda não sei</option></select></div>
  <label class="gnu-consentimento" for="h-ok"><input id="h-ok" type="checkbox"><span>Aceito a <a href="#">Política de Privacidade</a> e autorizo o contato do GNU.</span></label>
  <button class="gnu-btn gnu-btn--primario gnu-btn--bloco" type="submit">Quero ser associado</button>
</form>
    </div>
  </div>
  <div class="h__foto"><img src="/_blob/b51286f637f26b5e6870e3bb53f66c79" alt="Piscina da sede Alto Petrópolis entre as árvores, em dia de sol"></div>
</section>
</body>
</html>
